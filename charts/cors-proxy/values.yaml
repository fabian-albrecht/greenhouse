# Default values for cors-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: ghcr.io/cloudoperators/greenhouse
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag:
  # Overrides the image tag to use a specific digest instead
  # digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

# Exposure mode for the service: how Greenhouse exposes this component.
#   ingress -> render a Kubernetes Ingress (default, unchanged behavior)
#   gateway -> render a Gateway API HTTPRoute instead
exposure:
  mode: ingress

# DNS provider selects which DNS-automation annotations are placed on the
# exposure resource. Defaults to the SAP "disco" controller (current behavior).
#   disco | external-dns | gardener | none
dns:
  provider: disco

# Deployment platform. Selects cert handling (tls-acme vs gardener cert-service).
#   generic | gardener
platform: generic

ingress:
  enabled: true
  className: "nginx"
  annotations:
    disco: "true"
    kubernetes.io/tls-acme: "true"
  tls: true

# Gateway API settings, used when exposure.mode == "gateway".
gateway:
  # Name/namespace of the parent Gateway to attach the HTTPRoute to.
  parentRefName: ""
  parentRefNamespace: ""
  # Gateway listener section name (optional).
  sectionName: ""

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []
