{{- if eq .Values.exposure.mode "gateway" -}}
{{- $fullName := include "idproxy.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "idproxy.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ required "gateway.parentRefName is required when exposure.mode=gateway" .Values.gateway.parentRefName }}
      {{- with .Values.gateway.parentRefNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ include "idproxy.auth.hostname" $ | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
{{- end }}
