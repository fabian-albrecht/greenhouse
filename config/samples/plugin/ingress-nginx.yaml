apiVersion: greenhouse.sap/v1alpha1
kind: Plugin
metadata:
  name: ingress-nginx
  namespace: greenhouse
spec:
  pluginDefinitionRef:
    kind: PluginDefinition
    name: ingress-nginx
  optionValues:
    - name: controller.service.type
      value: NodePort
    - name: controller.hostPort.enabled
      value: true
    - name: controller.kind
      value: DaemonSet
    - name: controller.ingressClassResource.default
      value: true
