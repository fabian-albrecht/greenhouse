# kgateway controller. On startup it creates the default GatewayClass named
# "kgateway", which the manager chart's central Gateway references via
# gateway.className (set in dev-env/install.values.yaml). Requires the
# k8s-gateway-api and kgateway-crds Plugins to be installed first.
apiVersion: greenhouse.sap/v1alpha1
kind: Plugin
metadata:
  name: kgateway
  namespace: greenhouse
spec:
  pluginDefinitionRef:
    kind: PluginDefinition
    name: kgateway
  optionValues:
    - name: controller.replicaCount
      value: 1
