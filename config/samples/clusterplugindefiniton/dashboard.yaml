apiVersion: greenhouse.sap/v1alpha1
kind: ClusterPluginDefinition
metadata:
  name: dashboard
spec:
  version: 0.4.1
  displayName: Greenhouse Dashboard
  description: Greenhouse web dashboard (Juno)
  helmChart:
    name: dashboard
    repository: oci://ghcr.io/fabian-albrecht/greenhouse-helm/charts
    version: 0.4.1
  options:
    - name: global.dnsDomain
      description: DNS domain used to construct the dashboard ingress hostname
      required: true
      type: string
    - name: global.oidc.clientID
      description: OIDC client ID for the dashboard
      required: true
      type: string
    - name: ingress.className
      description: IngressClass to use for the dashboard ingress
      required: false
      type: string
      default: nginx
    - name: dns.provider
      description: "DNS provider for ingress annotations: disco | external-dns | gardener | none"
      required: false
      type: string
      default: external-dns
    - name: platform
      description: "Deployment platform for cert handling: generic | gardener"
      required: false
      type: string
      default: generic
    - name: replicas
      description: Number of dashboard replicas
      required: false
      type: int
      default: 1
    - name: corsProxy.enabled
      description: Deploy the merged cors-proxy alongside the dashboard
      required: false
      type: bool
      default: true
