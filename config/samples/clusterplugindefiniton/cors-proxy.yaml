apiVersion: greenhouse.sap/v1alpha1
kind: ClusterPluginDefinition
metadata:
  name: cors-proxy
spec:
  version: 0.12.1
  displayName: CORS Proxy
  description: Reverse proxy that adds CORS headers for the Greenhouse dashboard
  helmChart:
    name: cors-proxy
    repository: oci://ghcr.io/fabian-albrecht/greenhouse/charts
    version: 0.12.1
  options:
    - name: ingress.className
      description: IngressClass to use for the cors-proxy ingress
      required: false
      type: string
      default: nginx
    - name: dns.provider
      description: "DNS provider for ingress annotations: disco | external-dns | gardener | none"
      required: false
      type: string
      default: external-dns
    - name: platform
      description: "Deployment platform for cert handling: generic | gardener"
      required: false
      type: string
      default: generic
    - name: replicaCount
      description: Number of cors-proxy replicas
      required: false
      type: int
      default: 1
