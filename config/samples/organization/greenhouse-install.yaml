apiVersion: greenhouse.sap/v1alpha1
kind: Organization
metadata:
  name: greenhouse
spec:
  description: Greenhouse System Organization
  mappedOrgAdminIdPGroup: GREENHOUSE_ORG_ADMIN_LOCAL
