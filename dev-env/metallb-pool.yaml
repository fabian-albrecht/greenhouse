#
# metallb L2 address pool for the kind docker bridge subnet.
# Adjust the addresses range if your kind network uses a different subnet
# (check: docker network inspect kind | grep Subnet).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kind-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.18.0.200-172.18.0.210
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: kind-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - kind-pool
