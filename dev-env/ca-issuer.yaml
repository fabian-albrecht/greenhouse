# Self-signed CA for local dev — all *.install.greenhouse ingress certs are
# signed by this CA. Import the resulting secret's tls.crt into your OS/browser
# trust store once and all endpoints are trusted without per-cert warnings.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: greenhouse-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: greenhouse-install-ca
  secretName: greenhouse-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: greenhouse-ca
spec:
  ca:
    secretName: greenhouse-ca
