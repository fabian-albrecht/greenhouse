global:
  dnsDomain: localhost
  oidc:
    dashboardClientID: ""
alerts:
  enabled: false

replicas: 1

image:
  repository: ghcr.io/cloudoperators/juno-app-greenhouse
  digest: latest
  pullPolicy: IfNotPresent

dashboard:
  assetServerURL: origin
  demoUser:
    token: demo

# The dev setup deploys charts/cors-proxy standalone (see dev-env/ui.config.yaml),
# so disable the dashboard's bundled cors-proxy subchart to avoid deploying it
# twice into the same release/namespace.
cors-proxy:
  enabled: false
