name: kro lint

on:
  pull_request:
    paths:
      - 'deploy/kro/**'

permissions:
  contents: read

jobs:
  yaml-validate:
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Validate kro manifests parse as YAML
        run: |
          set -e
          for f in deploy/kro/*.yaml; do
            echo "Validating $f"
            yq 'true' "$f" > /dev/null
          done
